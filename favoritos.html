<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Favoritos - NovaTech</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/favoritos.css" />
  </head>
  <body>

    <header class="navbar">
      <div class="logo">
        <a href="index.html" class="logo-link"><img src="img/logo.png" alt="NovaTech" /></a>
      </div>

      <nav class="menu">
        <a href="index.html">Inicio</a>
        <a href="catalogo.html">Productos</a>
        <a href="favoritos.html">Favoritos <span id="fav-count" class="fav-count">0</span></a>
        <a href="contacto.html">Contacto</a>
        <a href="quienes-somos.html">¿Quiénes somos?</a>
      </nav>

      <div class="buscador">
        <input type="text" placeholder="Buscar en catálogo..." disabled style="opacity:0.65" title="Usa el catálogo para buscar">
      </div>

      <div class="acciones">
        <div class="acciones-auth" id="acciones-auth">
          <a href="sesion.html" class="button button--nav">Iniciar sesión</a>
          <a href="sesion.html?registro=1" class="btn-login btn-login--nav">Regístrate</a>
        </div>
        <div class="carrito" title="Carrito">🛒 <span id="cart-count" class="fav-count">0</span></div>
      </div>
    </header>

    <main>
      <section class="fav-header">
        <h2 class="fav-header__title">Tus favoritos</h2>
      </section>

      <section id="favoritos">
        <div class="no-favoritos">
          <p>Aún no tienes productos agregados a favoritos.</p>
          <button id="ir-productos-btn" class="btn-primary" onclick="window.location.href='catalogo.html'">Haz clic aquí</button>
        </div>
      </section>
    </main>

    <!-- Shared utilities (toasts, counter) -->
    <div id="toast-container"></div>
    <script src="js/script.js"></script>
    <script src="js/nav-auth.js"></script>
    <script src="js/favoritos.js"></script>

    <footer class="footer">
      <div class="footer-contenido">
        <!-- footer same as index.html -->
      </div>
      <div class="footer-copy">
        <p>© 2026 NovaTech - Todos los derechos reservados</p>
      </div>
    </footer>
  </body>
</html>
